<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ATLAS Automation Exporter / Editor installieren</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #071115;
        --panel: #10191d;
        --line: #24434a;
        --text: #f4fbff;
        --muted: #b7c8ce;
        --teal: #19d6c3;
        --orange: #ff9f0a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      main {
        width: min(760px, calc(100vw - 32px));
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        padding: 28px;
      }

      img {
        width: 88px;
        height: 88px;
      }

      h1 {
        margin: 18px 0 8px;
      }

      p {
        color: var(--muted);
        line-height: 1.55;
      }

      code {
        color: var(--teal);
      }

      a.button {
        min-height: 42px;
        padding: 0 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: var(--orange);
        color: #101014;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="plugins/automation-exporter-editor/icon.svg" alt="">
      <h1>ATLAS Automation Exporter / Editor</h1>
      <p>Fuege dieses Repository in ATLAS Administration hinzu, um das Plugin im Hub zu testen.</p>
      <p><code>https://raw.githubusercontent.com/rockbaer2007/atlas-automation-exporter-editor-plugin/main/repository.json</code></p>
      <a class="button" href="https://raw.githubusercontent.com/rockbaer2007/atlas-automation-exporter-editor-plugin/main/repository.json">Repository JSON oeffnen</a>
    </main>
  </body>
</html>
